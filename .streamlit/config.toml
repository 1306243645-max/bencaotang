[theme]
primaryColor = "#9B8EC4"
backgroundColor = "#FAF8FC"
secondaryBackgroundColor = "#F5F2FA"
textColor = "#3C3C3C"
font = "sans serif"

[server]
headless = true
enableCORS = true
enableXsrfProtection = false
port = 8501
enableWebsocketCompression = false

[browser]
gatherUsageStats = false
serverAddress = "localhost"
serverPort = 8501
